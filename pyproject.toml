[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-information-system"
version = "0.1.0"
description = "Sistema académico de recuperación de información sobre FiQA."
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ris*"]
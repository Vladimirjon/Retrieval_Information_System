<div class="jab" data-mode="home" data-view="buscar">
  <template data-logo-svg>{{LOGO}}</template>

  <header class="top">
    <nav class="nav" aria-label="Vistas">
      <a href="#" data-view-link="buscar" aria-current="page">Buscar</a>
      <a href="#" data-view-link="comparar">Comparar</a>
      <a href="#" data-view-link="metricas">Métricas</a>
    </nav>
  </header>

  <div class="jab-main">
    <section class="home" aria-label="Inicio">
      <a class="logo first" href="#" aria-label="jab, inicio" data-logo></a>
      <div class="slot" data-slot="home"></div>
      <div class="examples" aria-label="Ejemplos">
        <button class="example" type="button">How should I invest my savings?</button>
        <button class="example" type="button">What is a good credit score?</button>
        <button class="example" type="button">Should I pay off my mortgage early?</button>
      </div>
    </section>

    <div class="results-head">
      <a class="logo" href="#" aria-label="jab, inicio" data-logo data-home></a>
      <div class="slot" data-slot="results"></div>
    </div>

    <div class="bar" role="search">
      <span class="bar-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      </span>
      <label class="sr-only" for="jab-q">Consulta</label>
      <input id="jab-q" type="text" autocomplete="off" spellcheck="false" maxlength="300"
             placeholder="Busca en FiQA: How should I invest my savings?"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="jab-suggest">
      <button class="clear" type="button" aria-label="Borrar" hidden>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
      <button class="chip" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="jab-menu">
        <span data-model-name>BM25</span>
        <kbd class="kbd">Ctrl K</kbd>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
      </button>
      <span class="progress" aria-hidden="true"></span>

      <ul class="suggest" id="jab-suggest" role="listbox" aria-label="Sugerencias" hidden></ul>

      <div class="menu" id="jab-menu" role="menu" aria-label="Modelo y ajustes" hidden>
        <p class="menu-label">Modelo</p>
        <div role="group" data-models></div>
        <hr>
        <div class="setting"><span>Resultados</span><div class="seg" data-k></div></div>
        <div class="setting" data-stem-row tabindex="0" data-tip="Porter reduce palabras inglesas a su raíz para buscar variantes. No se aplica a Embeddings."><span>Raíz de palabras</span><button class="switch" type="button" role="switch" aria-checked="false" aria-label="Raíz de palabras (Porter)"></button></div>
      </div>
    </div>

    <section class="results" aria-label="Resultados">
      <p class="status num" role="status" aria-live="polite"></p>
      <ol class="list"></ol>
      <nav class="pager" aria-label="Páginas de resultados" hidden></nav>
    </section>
  </div>
  <div id="jab-tip" class="tooltip" role="tooltip" hidden></div>
</div>
